[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netcmd"
version = "1.2.2"
description = "Multivendor SSH CLI command runner with parallel and interactive workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "jpesqueda" }]
keywords = ["network automation", "ssh", "netmiko", "cisco", "arista", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
dependencies = ["netmiko>=4.3,<5", "rich>=13.7,<15"]

[project.urls]
Homepage = "https://github.com/jpesqueda/NetCmd"
Repository = "https://github.com/jpesqueda/NetCmd"
Issues = "https://github.com/jpesqueda/NetCmd/issues"

[project.scripts]
netcmd = "netcmd:main"

[tool.setuptools]
py-modules = ["netcmd"]
